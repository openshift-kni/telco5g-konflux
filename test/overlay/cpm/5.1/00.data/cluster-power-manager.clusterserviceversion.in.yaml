---
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "cpm.openshift.io/v1",
          "kind": "NodePowerState",
          "metadata": {
            "name": "example-nodepowerstate"
          },
          "spec": {
            "powerState": "On"
          }
        }
      ]
    capabilities: Basic Install
    containerImage: quay.io/openshift-kni/cluster-power-manager
    description: The Cluster Power Manager for OpenShift provides power management services for OpenShift clusters.
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "true"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    olm.skipRange: '>=5.0.0 <5.1.0'
    operatorframework.io/suggested-namespace: openshift-cluster-power-manager
    operators.openshift.io/infrastructure-features: '["disconnected"]'
    operators.openshift.io/valid-subscription: '["OpenShift Container Platform", "OpenShift Platform Plus"]'
    operators.operatorframework.io/builder: operator-sdk-v1.28.0-ocp
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v3
    provider: Red Hat
    repository: https://github.com/openshift-kni/cluster-power-manager
    support: Red Hat
  labels:
    operatorframework.io/arch.amd64: supported
  name: cluster-power-manager.v0.0.1
  namespace: openshift-cluster-power-manager
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - description: NodePowerState is the Schema for the nodepowerstates API
        displayName: Node Power State
        kind: NodePowerState
        name: nodepowerstates.cpm.openshift.io
        resources:
          - kind: Deployment
            name: ""
            version: apps/v1
        version: v1
  description: "# Cluster Power Manager for OpenShift\nThe Cluster Power Manager for OpenShift provides power management services\nfor OpenShift clusters.\n"
  displayName: Cluster Power Manager
  icon:
    - base64data: 
      mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
            - apiGroups:
                - ""
              resources:
                - nodes
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - apps
              resources:
                - deployments
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - authentication.k8s.io
              resources:
                - tokenreviews
              verbs:
                - create
            - apiGroups:
                - authorization.k8s.io
              resources:
                - subjectaccessreviews
              verbs:
                - create
            - apiGroups:
                - cpm.openshift.io
              resources:
                - nodepowerstates
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - cpm.openshift.io
              resources:
                - nodepowerstates/finalizers
              verbs:
                - update
            - apiGroups:
                - cpm.openshift.io
              resources:
                - nodepowerstates/status
              verbs:
                - get
                - patch
                - update
          serviceAccountName: cluster-power-manager-controller-manager
      deployments:
        - label:
            app.kubernetes.io/component: cluster-power-manager
            app.kubernetes.io/name: cluster-power-manager-operator
            control-plane: controller-manager
          name: cluster-power-manager-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/component: cluster-power-manager
                app.kubernetes.io/name: cluster-power-manager-operator
                control-plane: controller-manager
            strategy:
              type: Recreate
            template:
              metadata:
                annotations:
                  target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
                labels:
                  app.kubernetes.io/component: cluster-power-manager
                  app.kubernetes.io/name: cluster-power-manager-operator
                  control-plane: controller-manager
              spec:
                containers:
                  - args:
                      - --metrics-bind-address=:8443
                      - --leader-elect
                    command:
                      - /usr/local/bin/manager
                    env:
                      - name: MY_POD_NAME
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.name
                      - name: MY_POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    image: quay.io/openshift-kni/cluster-power-manager:5.1.0
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8081
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    ports:
                      - containerPort: 8443
                        name: https
                        protocol: TCP
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8081
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      requests:
                        cpu: 100m
                        memory: 20Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - mountPath: /secrets/tls/metrics
                        name: metrics-tls
                serviceAccountName: cluster-power-manager-controller-manager
                terminationGracePeriodSeconds: 10
                volumes:
                  - name: metrics-tls
                    secret:
                      defaultMode: 420
                      secretName: controller-manager-metrics-tls
      permissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
          serviceAccountName: cluster-power-manager-controller-manager
    strategy: deployment
  installModes:
    - supported: true
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: false
      type: AllNamespaces
  keywords:
    - power-management
  links:
    - name: Cluster Power Manager
      url: https://cluster-power-manager.domain
  maturity: alpha
  provider:
    name: Red Hat
  replaces: cluster-power-manager.v0.0.0
  version: 0.0.1
